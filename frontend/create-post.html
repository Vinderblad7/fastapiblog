<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/register.css">
    <link rel="stylesheet" href="./css/profile.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/post.css">
    <link rel="stylesheet" href="./css/create-post.css">
</head>

<body>

    <header class="header">

        <div class="container">

            <a class="header-logo" href="index.html">
                <img class="header-logo-image"
                 src="./assets/icons/Logo.svg"
                 alt="VT Logo"
                 width="50"
                 height="50"
                 loading="lazy">
            </a>   

            <div class="header-actions">

                <a href="create-post.html">
                    <button class="header-action-button" id="create-postbutton">Create Post</button>
                </a>

               <button class="header-action-button" id="searchbutton">Search</button>

               <a href="login.html">
                <button class="header-action-button" id="loginbutton">Login</button>
               </a>

               <a class="header-avatar" href="profile.html">
                <img class="header-avatar-image"
                 src="./assets/images/avatar.jpeg"
                 alt="User Avatar"
                 width="40"
                 height="40"
                 loading="lazy">
            </a>
            
            </div>
            
        </div>

    </header>

        <main class="create-post">

            <a href="index.html" class="back-link">Back To Home</a>

            <div class="create-post__container">

                <h1 class="create-post__title">
                    Create New Post
                </h1>

                <form class="create-post__form">

                    <div class="create-post__image">

                        <span>Upload Image</span>

                        <button type="button">
                            + Add Image
                        </button>

                    </div>

                    <lable class="create-post__lable">
                        Title
                    </lable>

                    <input class="create-post__input" type="text" placeholder="Enter post title">

                    <label class="create-post__label">
                        Description
                    </label>

                    <textarea class="create-post__description" placeholder="Write something..."></textarea>

                    <button class="create-post__submit" type="submit">
                        Publish
                    </button>

                </form>

            </div>
        </main>

</body>
